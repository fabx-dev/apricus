name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    # Upper bound for the whole job (lint + format + tests + deb/rpm
    # packaging). A stuck runner fails here instead of hanging forever.
    timeout-minutes: 20
    steps:
      # Pinned by SHA (tags are mutable); update deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system deps (PyGObject + GI typelibs)
        # Bounded step timeout plus bounded retries: apt mirrors can stall
        # (this hung indefinitely once). At most 3 attempts per command,
        # then the step fails instead of looping forever.
        timeout-minutes: 15
        run: |
          updated=false
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get update; then updated=true; break; fi
            sleep 15
          done
          if [ "$updated" != "true" ]; then exit 1; fi
          installed=false
          for attempt in 1 2 3; do
            if sudo timeout 600 apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gdk-3.0 gir1.2-appindicator3-0.1 gir1.2-gnomedesktop-4.0 gir1.2-wnck-3.0 gir1.2-webkit2-4.1 gir1.2-gtk-4.0 gir1.2-adw-1 meson ninja-build gettext desktop-file-utils libglib2.0-dev libglib2.0-dev-bin rpm; then installed=true; break; fi
            sleep 15
          done
          if [ "$installed" != "true" ]; then exit 1; fi

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync dev environment (frozen to uv.lock)
        run: |
          uv venv --system-site-packages
          uv sync --frozen

      - name: Lint
        run: make lint

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Tests
        run: uv run pytest tests/ -q

      - name: GTK4 panel import smoke test (no display)
        run: PYTHONPATH=src uv run python -c "import apricus.gui.gtk4app, apricus.gui.gtk4lib; print('gtk4 imports ok')"

      - name: Build and verify .deb and .rpm packages
        run: |
          ./pkgs/deb/build-deb.sh
          dpkg-deb --info dist/apricus_*.deb
          ./pkgs/rpm/build-rpm.sh
          rpm -qip dist/apricus-*.rpm
