name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (PyGObject + GI typelibs)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gdk-3.0 gir1.2-appindicator3-0.1 gir1.2-gnomedesktop-4.0 gir1.2-wnck-3.0

      - uses: astral-sh/setup-uv@v5

      - name: Sync dev environment
        run: make sync

      - name: Lint
        run: make lint

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Tests
        run: uv run pytest tests/ -q
