name: Release Packages (.deb, .rpm, .snap, .flatpak)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gettext desktop-file-utils libglib2.0-dev libglib2.0-dev-bin libgtk-4-bin

      - name: Build .deb
        run: |
          ./pkgs/deb/build-deb.sh
          dpkg-deb --info dist/apricus_*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-deb
          path: dist/apricus_*.deb

  build-rpm:
    name: Build .rpm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gettext desktop-file-utils libglib2.0-dev libglib2.0-dev-bin libgtk-4-bin rpm

      - name: Build .rpm
        run: |
          ./pkgs/rpm/build-rpm.sh
          rpm -qip dist/apricus-*.rpm

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-rpm
          path: dist/apricus-*.rpm

  build-snap:
    name: Build .snap package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Build Snap (destructive-mode on clean core24 runner)
        run: |
          sudo snapcraft pack --destructive-mode
          mkdir -p dist
          mv apricus_*.snap dist/
          unsquashfs -d /tmp/snap-check dist/apricus_*.snap usr/bin/apricus usr/share/apricus >/dev/null
          head -n1 /tmp/snap-check/usr/bin/apricus | grep -q "/usr/bin/env python3"
          rm -rf /tmp/snap-check

      - name: Upload .snap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-snap
          path: dist/apricus_*.snap

      - name: Verify Snapcraft credentials and publish on release tags
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS not set, skipping Snap Store step."
            exit 0
          fi
          snapcraft whoami
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            snapcraft upload --release=stable dist/apricus_*.snap
          else
            echo "Credentials verified (no upload on non-tag run)."
          fi

  build-flatpak:
    name: Build .flatpak bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install flatpak-builder and GNOME 50 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Cache .flatpak-builder
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ runner.os }}-${{ hashFiles('pkgs/flatpak/vlc.json', 'pkgs/flatpak/pypi-deps.json', 'pkgs/flatpak/deno.json') }}
          restore-keys: |
            flatpak-builder-${{ runner.os }}-

      - name: Build Flatpak and export bundles
        run: |
          VERSION="$(sed -n "s/.*version:[[:space:]]*'\([^']*\)'.*/\1/p" meson.build | head -n1)"
          mkdir -p dist
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo build-flatpak-ci pkgs/flatpak/io.github.fabx_dev.Apricus.json
          flatpak build-bundle flatpak-repo "dist/apricus-${VERSION}.flatpak" io.github.fabx_dev.Apricus
          flatpak build-bundle --runtime flatpak-repo "dist/apricus-locale.flatpak" io.github.fabx_dev.Apricus.Locale
          rm -rf build-flatpak-ci flatpak-repo

      - name: Upload .flatpak artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-flatpak
          path: dist/*.flatpak

  attach-to-release:
    name: Attach packages to GitHub Release
    needs: [build-deb, build-rpm, build-snap, build-flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS and upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum apricus* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "${{ github.repository }}" --clobber apricus* SHA256SUMS.txt
          else
            gh release create "$TAG" -R "${{ github.repository }}" --title "Apricus ${TAG#v}" --generate-notes apricus* SHA256SUMS.txt
          fi
